# GitHub Pages entry point for JARC Database. Runs only when started manually (Actions → Publish Jarc Database).
#
# Pages publishes ONE self-contained page (pages/index.html) that sends visitors to the Railway app, where the app, the
# API and the Microsoft sign-in session share one origin. The app itself (site/) is not published here: on github.io
# it would have no API and could only use browser storage.
name: Publish Jarc Database
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jarc-database-pages
  cancel-in-progress: false

env:
  APP_URL: https://jarc-database-production.up.railway.app/

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read this repository
        uses: actions/checkout@v6
      - name: Prepare the entry page
        # index.html redirects to the app; 404.html is the same page, so any old link under the Pages URL
        # (e.g. /Jarc-database/?storage=resource or a former asset path) also ends up at the app.
        run: |
          mkdir _pages
          cp pages/index.html _pages/index.html
          cp pages/index.html _pages/404.html
          touch _pages/.nojekyll
      - name: Check prepared files
        # Fail before publishing if the page doesn't point at the app or anything else was included.
        run: |
          grep -q "content=\"0; url=${APP_URL}\"" _pages/index.html
          grep -q "href=\"${APP_URL}\"" _pages/index.html
          if grep -Eq '(src|href)="(assets/|/|\./)' _pages/index.html; then echo "The entry page must not load assets."; exit 1; fi
          test "$(find _pages -type f | sort | tr '\n' ' ')" = "_pages/.nojekyll _pages/404.html _pages/index.html "
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the entry page
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
      - name: Publish when manually requested
        id: deployment
        uses: actions/deploy-pages@v4
